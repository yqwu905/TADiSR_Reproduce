ftsr_dir: dataset/FTSR
realce_dir:
use_kolors: true
context_dim: 4096
jsd_dim: 128
lora_rank: 16
lora_include_self_attention: false  # true also applies UNet LoRA to attn1 self-attention
precomputed_text_context_path: null  # e.g. assets/fixed_prompt_context.pt
device: cpu
dist_strategy: ddp  # ddp | fsdp
precision: bf16  # bf16 | fp16 | fp32
gradient_checkpointing: true
fsdp_auto_wrap: true
fsdp_activation_checkpointing: true
taca_query_chunk_size: 1024
taca_checkpoint: true
taca_detach: false
fail_on_lora_error: true
require_precomputed_text_context: false
lpips_resize: 512
batch_size: 1
lr: 0.00005
grad_clip: 1.0
warmup_iters: 0
max_iters: 200000
epochs: 9999
log_every: 10
save_every: 5000
ckpt_dir: checkpoints
resume_from: null  # e.g. checkpoints/tadisr_step5000.pt
tensorboard_log_dir: checkpoints/tensorboard
tensorboard_image_every: 100
tensorboard_image_max_samples: 1
tensorboard_image_size: 256
