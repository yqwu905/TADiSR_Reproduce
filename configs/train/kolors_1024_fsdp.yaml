ftsr_dir: dataset/FTSR
realce_dir: dataset/Real-CE
use_kolors: true
context_dim: 4096
jsd_dim: 128
lora_rank: 16
lora_include_self_attention: false  # true also applies UNet LoRA to attn1 self-attention
precomputed_text_context_path: assets/fixed_prompt_context.pt
require_precomputed_text_context: true
device: cuda
dist_strategy: fsdp
precision: bf16
gradient_checkpointing: true
fsdp_auto_wrap: true
fsdp_activation_checkpointing: true
taca_query_chunk_size: 1024
taca_checkpoint: true
taca_detach: false
fail_on_lora_error: true
lpips_resize: 512
batch_size: 1
lr: 0.00005
lr_scheduler: cosine  # cosine | constant | none
grad_clip: 1.0
warmup_iters: 2000
min_lr_ratio: 0.1
max_iters: 200000
epochs: 9999
log_every: 10
save_every: 5000
ckpt_dir: checkpoints/kolors_1024_fsdp
resume_from: null  # FSDP resume is not implemented yet
tensorboard_log_dir: checkpoints/tensorboard/kolors_1024_fsdp
